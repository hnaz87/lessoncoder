function fillVoiceNames(){
  const sel = $('#opt-voicename'); if (!sel) return;
  if (Player.voiceMode === 'ai'){
    const vs = (Server.config && Server.config.voices) || ['nova'];
    sel.innerHTML = vs.map(v => `<option ${v === VoiceAI.voice ? 'selected' : ''} value="${esc(v)}">${esc(v[0].toUpperCase() + v.slice(1))}</option>`).join('');
    sel.disabled = false;
  } else if (Player.voiceMode === 'browser' && window.speechSynthesis){
    const vs = speechSynthesis.getVoices().filter(v => /^en/i.test(v.lang));
    if (!Player.voiceName && vs[0]) Player.voiceName = vs[0].name;
    sel.innerHTML = vs.length ? vs.map(v => `<option ${v.name === Player.voiceName ? 'selected' : ''}>${esc(v.name)}</option>`).join('') : '<option>Default voice</option>';
    sel.disabled = false;
  } else { sel.innerHTML = '<option>—</option>'; sel.disabled = true; }
}
function updateRenderNote(){
  const el = $('#render-note'); if (!el) return;
  const mime = pickMime(Player.voiceMode === 'ai');
  if (!mime){ el.textContent = 'This browser cannot record video. Use Chrome or Edge to export.'; return; }
  const fmt = mime.includes('mp4') || (Server.config && Server.config.ffmpeg) ? 'MP4' : 'WebM';
  el.textContent = `Exports ${fmt} with captions burned in${Player.voiceMode === 'ai' ? ' and the AI narrator on the soundtrack' : ''}. Rendering runs in real time.` +
    (Player.voiceMode === 'browser' ? ' The browser voice is preview-only and is not recorded — choose the AI narrator to include voice.' : '');
}
async function applyVoiceMode(){
  if (Player.voiceMode === 'browser' && !window.speechSynthesis) Player.voiceMode = 'off';
  Player.pause();
  Player.voice = Player.voiceMode !== 'off';
  VoiceAI.enabled = Player.voiceMode === 'ai';
  fillVoiceNames(); updateRenderNote();
  const status = $('#voice-status');
  if (VoiceAI.enabled){
    const token = {}; applyVoiceMode.token = token;
    try {
      await VoiceAI.prepare(Player.lesson, (d, n) => { if (status && applyVoiceMode.token === token) status.textContent = d < n ? `Generating narration… ${d} of ${n} sentences` : ''; });
      if (applyVoiceMode.token !== token) return;
      if (status) status.textContent = 'Narration ready. Timing now follows the real voice.';
    } catch (e) { if (status) status.textContent = 'Narrator voice failed: ' + e.message; }
  } else if (status) status.textContent = Player.voiceMode === 'browser' ? 'The preview waits for the voice to finish each sentence.' : '';
  const ci = Player.tl ? sceneAt(Player.tl, Player.t).index : null;
  Player.rebuild();
  if (ci != null && Player.tl.scenes[ci]) Player.t = Player.tl.scenes[ci].start;
  mountStripOnly(); updateTransport(); Player.draw();
}
function mountStripOnly(){ const strip = $('#strip'); if (strip) strip.innerHTML = Player.tl.scenes.map((c, i) => `<button data-act="jump" data-i="${i}" style="flex:${(c.end - c.start).toFixed(2)}" title="${esc(c.scene.title)}">${i+1}</button>`).join(''); }
function updateTransport(){
  if (App.view !== 'studio' || !Player.tl) return;
  const sc = $('#scrub'), tm = $('#time'), pb = $('#play');
  if (sc && document.activeElement !== sc) sc.value = Math.round(1000 * Player.t / Math.max(0.01, Player.tl.total));
  if (tm) tm.textContent = `${fmtTime(Player.t)} / ${fmtTime(Player.tl.total)}`;
  if (pb) pb.textContent = Player.playing ? 'Pause' : 'Play';
  const cur = sceneAt(Player.tl, Player.t);
  $$('#strip button').forEach((b, i) => b.classList.toggle('on', cur && i === cur.index));
}

async function startGeneration(form){
  App.form = form;
  const ctl = new AbortController();
  App.gen = {form, steps:[], error:null, ctl};
  go('generating');
  const onStep = s => {
    const ex = App.gen.steps.find(x => x.key === s.key);
    if (ex) Object.assign(ex, Object.fromEntries(Object.entries(s).filter(([, v]) => v != null)));
    else App.gen.steps.push(Object.assign({label:'', sub:''}, s));
    if (App.view === 'generating') render();
  };
  try {
    const {lesson, failures} = await generateLesson(form, onStep, ctl.signal);
    App.lessons[lesson.id] = lesson; App.current = lesson; App.issues = {};
    lesson.scenes.forEach(s => { App.issues[s.scene_id] = s._warnings || []; });
    await Store.saveLesson(lesson);
    go('review', {sel:'overview'});
    toast(failures.length ? `Lesson created. ${failures.length} scene${failures.length > 1 ? 's' : ''} need your attention.` : 'Lesson created. Review it, then generate the video.');
  } catch (e) {
    App.gen.steps.forEach(s => { if (s.state === 'run') s.state = 'fail'; });
    App.gen.error = aiErrorCopy(e);
    if (App.view === 'generating') render();
  }
}
function openLesson(id, view='review'){
  const l = App.lessons[id]; if (!l) return;
  validateLesson(l);
  App.current = l; App.issues = {};
  go(view, {sel:'overview'});
}

document.addEventListener('click', async e => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  const act = el.dataset.act, L = App.current;
  switch (act){
    case 'home': go(App.profile ? 'dashboard' : 'auth'); break;
    case 'auth-switch': App.authMode = App.authMode === 'login' ? 'signup' : 'login'; render(); break;
    case 'logout': try { await api('POST', '/api/auth/logout', {}); } catch {} App.profile = null; App.lessons = {}; App.current = null; go('auth', {authMode:'login'}); break;
    case 'new': App.form = null; go('create'); break;
    case 'edit-form': go('create'); break;
    case 'sample': { const l = makeSample(el.dataset.p); App.lessons[l.id] = l; await Store.saveLesson(l); openLesson(l.id, 'studio'); break; }
    case 'open': openLesson(el.dataset.id); break;
    case 'open-studio': openLesson(el.dataset.id, 'studio'); break;
    case 'delete': { const l = App.lessons[el.dataset.id]; if (l && confirm(`Delete "${l.lesson_title}"? This can't be undone.`)){ delete App.lessons[l.id]; await Store.deleteLesson(l.id); render(); toast('Lesson deleted.'); } break; }
    case 'stop-gen': App.gen.ctl.abort(); App.gen.error = 'Generation stopped.'; render(); break;
    case 'retry-gen': startGeneration(App.gen.form); break;
    case 'sel': App.sel = el.dataset.i === 'overview' ? 'overview' : +el.dataset.i; render(); break;
    case 'studio': App.studioScene = null; go('studio'); break;
    case 'back-review': go('review'); break;
    case 'add-scene': L.scenes.push({scene_id:uid('scene'), scene_type:'explanation', title:'New scene', visual_description:'', code:'', blocks:[], expected_output:'', beats:[{narration:'Describe what this scene teaches.', events:[{type:'SHOW_TEXT', style:'heading', text:'New scene'}]}]}); App.sel = L.scenes.length - 1; saveSoon(); render(); break;
    case 'scene-up': case 'scene-down': { const i = App.sel, j = act === 'scene-up' ? i - 1 : i + 1; [L.scenes[i], L.scenes[j]] = [L.scenes[j], L.scenes[i]]; App.sel = j; saveSoon(); render(); break; }
    case 'scene-del': if (L.scenes.length > 1 && confirm('Delete this scene?')){ L.scenes.splice(App.sel, 1); App.sel = Math.min(App.sel, L.scenes.length - 1); saveSoon(); render(); } break;
    case 'add-beat': L.scenes[App.sel].beats.push({narration:'', events:[]}); saveSoon(); render(); break;
    case 'del-beat': L.scenes[App.sel].beats.splice(+el.dataset.j, 1); saveSoon(); render(); break;
    case 'add-mistake': L.common_mistakes.push({mistake:'New mistake', fix:''}); saveSoon(); render(); break;
    case 'add-q': L.quiz.push({question:'New question', options:['Option A','Option B','Option C','Option D'], answer_index:0, explanation:''}); saveSoon(); render(); break;
    case 'del-q': L.quiz.splice(+el.dataset.i, 1); saveSoon(); render(); break;
    case 'run-code': { el.disabled = true; el.textContent = 'Running…'; const s = L.scenes[App.sel]; runCache.delete(s.code); const r = await runPython(s.code); if (r.unavailable) toast('The Python sandbox could not load in this view.'); render(); break; }
    case 'use-output': { const s = L.scenes[App.sel]; const r = runCache.get(s.code); if (r) { s.expected_output = r.output.replace(/\n$/, ''); saveSoon(); render(); } break; }
    case 'preview-scene': App.studioScene = App.sel; go('studio'); break;
    case 'regen-scene': regenScene(el); break;
    case 'export-json': saveFile(safeName(L.lesson_title) + '.json', JSON.stringify(stripRuntime(L), null, 2)); break;
    case 'play': Player.playing ? Player.pause() : Player.play(); break;
    case 'restart': Player.seek(0); break;
    case 'jump': Player.seek(Player.tl.scenes[+el.dataset.i].start); break;
    case 'render-full': recordRange(0, Player.tl.total, 'full lesson'); break;
    case 'render-scene': { const c = sceneAt(Player.tl, Player.t); recordRange(c.start, c.end, `scene ${c.index + 1}`); break; }
    case 'export-vtt': saveFile(safeName(L.lesson_title) + '.vtt', buildVTT(Player.tl)); break;
  }
});

/* ---------- boot ---------- */
(async function boot(){
  try { Server.config = await api('GET', '/api/config', undefined, {noAuthRedirect:true}); }
  catch (e) { go('fatal', {fatal:e.message}); return; }
  Player.voiceMode = Server.config.tts ? 'ai' : (window.speechSynthesis ? 'browser' : 'off');
  if (Server.config.voices && Server.config.voices.length) VoiceAI.voice = Server.config.voices[0];
  App.profile = Server.config.user;
  try { await document.fonts.ready; } catch {}
  if (!App.profile){ go('auth', {authMode: Server.config.signup ? 'signup' : 'login'}); return; }
  try { App.lessons = (await Store.loadAll()).lessons; } catch (e) { if (e.status === 401) return; toast('Could not load lessons: ' + e.message); }
  go('dashboard');
})();
</script>
