<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CodeLesson AI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EEF1F6; --surface:#FFFFFF; --surface2:#F6F8FB; --ink:#182033; --muted:#5B6680;
  --line:#D6DCE7; --accent:#2E57E8; --accent-ink:#FFFFFF; --accent-soft:#E3E9FD;
  --marker:#FFD54A; --danger:#B4232A; --danger-soft:#FBE6E7; --ok:#17784C; --ok-soft:#E1F3EA;
  --warn-soft:#FFF5D6;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0F1320; --surface:#171E30; --surface2:#1C2438; --ink:#E7EBF4; --muted:#9AA5BD;
    --line:#2A3550; --accent:#7B95FF; --accent-ink:#0F1320; --accent-soft:#232F55;
    --danger:#FF8A8F; --danger-soft:#3A1D24; --ok:#6FD3A0; --ok-soft:#173226; --warn-soft:#3A3218;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0F1320; --surface:#171E30; --surface2:#1C2438; --ink:#E7EBF4; --muted:#9AA5BD;
  --line:#2A3550; --accent:#7B95FF; --accent-ink:#0F1320; --accent-soft:#232F55;
  --danger:#FF8A8F; --danger-soft:#3A1D24; --ok:#6FD3A0; --ok-soft:#173226; --warn-soft:#3A3218;
  color-scheme:dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 Figtree,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:"Bricolage Grotesque",Figtree,system-ui,sans-serif;line-height:1.15;margin:0;font-weight:700}
h1{font-size:clamp(28px,4vw,40px);letter-spacing:-.01em}
h2{font-size:24px}
h3{font-size:18px}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.topbar{display:flex;align-items:center;gap:16px;padding:12px 24px;background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:env(safe-area-inset-top,0px);z-index:10}
.brand{display:flex;align-items:center;gap:10px;background:none;border:0;padding:0;cursor:pointer;font-family:"Bricolage Grotesque",Figtree,sans-serif;font-weight:700;font-size:20px}
.mark{width:30px;height:30px;border-radius:7px;background:var(--ink);position:relative;flex:none}
.mark::before{content:"";position:absolute;left:7px;top:8px;width:9px;height:3px;background:var(--bg);border-radius:2px;box-shadow:0 6px 0 var(--bg)}
.mark::after{content:"";position:absolute;left:7px;right:6px;top:19px;height:4px;background:var(--marker);border-radius:2px}
.topbar .spacer{flex:1}
.who{color:var(--muted);font-size:14px}
main{max-width:1200px;margin:0 auto;padding:28px 24px 72px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:9px 16px;border-radius:9px;font-weight:600;cursor:pointer;text-decoration:none;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.06)}
.btn.big{padding:13px 24px;font-size:17px;border-radius:11px}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted)}
.btn.ghost:hover{color:var(--ink);border-color:var(--line)}
.btn.danger{color:var(--danger)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.sm{padding:5px 10px;font-size:14px;border-radius:7px}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.stack{display:flex;flex-direction:column;gap:12px}
.muted{color:var(--muted)}
.small{font-size:14px}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;padding:3px 10px;border-radius:999px;background:var(--surface2);border:1px solid var(--line)}
.chip i{width:8px;height:8px;border-radius:50%;display:inline-block}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:22px}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:24px}
.page-head p{margin-top:6px}
/* dashboard */
.lesson-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px}
.lesson-item{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:10px}
.lesson-item h3{font-size:19px}
.lesson-item .meta{font-size:14px;color:var(--muted)}
.lesson-item .actions{margin-top:auto;display:flex;gap:8px}
.empty{border:2px dashed var(--line);border-radius:14px;padding:40px 24px;text-align:center;display:flex;flex-direction:column;gap:14px;align-items:center}
.samples{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px;margin-top:12px}
.sample{display:flex;flex-direction:column;align-items:flex-start;gap:4px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;cursor:pointer}
.sample:hover{border-color:var(--accent)}
.sample strong{font-size:16px}
.section-title{margin:36px 0 4px}
/* forms */
.form{display:grid;grid-template-columns:1fr 1fr;gap:18px 22px}
.form .full{grid-column:1/-1}
label.field{display:flex;flex-direction:column;gap:6px;font-weight:600;font-size:15px}
label.field .hint{font-weight:400;color:var(--muted);font-size:13px}
input[type=text],select,textarea{width:100%;border:1px solid var(--line);background:var(--surface2);border-radius:9px;padding:10px 12px;font-weight:400}
textarea{resize:vertical;min-height:84px}
textarea.code{font-family:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;font-size:14px;line-height:1.5;tab-size:4}
.seg{display:flex;flex-wrap:wrap;gap:8px}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg label{border:1px solid var(--line);background:var(--surface2);padding:8px 14px;border-radius:9px;cursor:pointer;font-weight:500;font-size:15px}
.seg input:checked+span{font-weight:700}
.seg label:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}
.seg label:has(input:focus-visible){outline:3px solid var(--accent);outline-offset:2px}
.platform-pick{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}
.platform-pick label{display:flex;flex-direction:column;gap:2px;border:1px solid var(--line);border-radius:11px;padding:12px 14px;cursor:pointer;background:var(--surface2)}
.platform-pick label:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}
.platform-pick label:has(input:focus-visible){outline:3px solid var(--accent);outline-offset:2px}
.platform-pick input{position:absolute;opacity:0;pointer-events:none}
.platform-pick strong{font-size:16px}
.platform-pick span{font-size:13px;color:var(--muted)}
.notice{border-radius:10px;padding:12px 14px;font-size:15px;border:1px solid var(--line);background:var(--surface2)}
.notice.err{background:var(--danger-soft);border-color:transparent;color:var(--danger)}
.notice.warn{background:var(--warn-soft);border-color:transparent}
.notice.ok{background:var(--ok-soft);border-color:transparent;color:var(--ok)}
.notice ul{margin:6px 0 0;padding-left:20px}
/* generating */
.gen{max-width:680px;margin:40px auto}
.steps{list-style:none;margin:22px 0;padding:0;display:flex;flex-direction:column;gap:10px}
.steps li{display:flex;gap:12px;align-items:flex-start;padding:10px 14px;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.steps .dot{width:20px;height:20px;border-radius:50%;flex:none;margin-top:2px;border:2px solid var(--line)}
.steps li.run .dot{border-color:var(--accent);border-top-color:transparent;animation:spin 1s linear infinite}
.steps li.done .dot{background:var(--ok);border-color:var(--ok)}
.steps li.fail .dot{background:var(--danger);border-color:var(--danger)}
.steps li .sub{font-size:13px;color:var(--muted)}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.steps li.run .dot{animation:none;border-top-color:var(--accent)}}
/* editor */
.editor{display:grid;grid-template-columns:280px 1fr;gap:20px;align-items:start}
.scene-nav{position:sticky;top:84px;display:flex;flex-direction:column;gap:4px;max-height:calc(100vh - 110px);overflow:auto}
.scene-nav button{display:flex;gap:10px;align-items:baseline;text-align:left;background:transparent;border:1px solid transparent;border-radius:9px;padding:8px 10px;cursor:pointer}
.scene-nav button:hover{background:var(--surface)}
.scene-nav button.on{background:var(--surface);border-color:var(--line);font-weight:600}
.scene-nav .n{font-family:"JetBrains Mono",monospace;font-size:12px;color:var(--muted);min-width:20px}
.scene-nav .t{flex:1}
.scene-nav .w{color:var(--danger);font-size:12px}
.scene-nav hr{border:0;border-top:1px solid var(--line);margin:8px 0}
.beat{border:1px solid var(--line);border-radius:11px;padding:14px;background:var(--surface2);display:grid;grid-template-columns:1fr 1fr;gap:12px}
.beat .bh{grid-column:1/-1;display:flex;justify-content:space-between;align-items:center}
.beat .bh b{font-size:14px;color:var(--muted);font-weight:600}
.beat textarea{background:var(--surface);min-height:96px}
.beat .err{grid-column:1/-1;color:var(--danger);font-size:13px}
.quiz-item{border:1px solid var(--line);border-radius:11px;padding:14px;background:var(--surface2);display:flex;flex-direction:column;gap:8px}
.dsl-help{font-size:13px;color:var(--muted)}
.dsl-help code{font-family:"JetBrains Mono",monospace;font-size:12px;background:var(--surface2);padding:1px 5px;border-radius:5px;border:1px solid var(--line)}
details summary{cursor:pointer;font-weight:600}
/* studio */
.studio{display:grid;grid-template-columns:1fr 300px;gap:20px;align-items:start}
.screen{background:#0B0F1A;border-radius:14px;overflow:hidden;position:relative}
.screen canvas{display:block;width:100%;height:auto;aspect-ratio:16/9}
.transport{display:flex;align-items:center;gap:12px;margin-top:12px;flex-wrap:wrap}
.transport input[type=range]{flex:1;min-width:160px;accent-color:var(--accent)}
.time{font-family:"JetBrains Mono",monospace;font-size:14px;color:var(--muted);min-width:110px;text-align:right}
.strip{display:flex;gap:4px;margin-top:12px;height:34px}
.strip button{border:0;border-radius:5px;background:var(--surface);border:1px solid var(--line);cursor:pointer;font-size:12px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;padding:0 6px;min-width:6px}
.strip button.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.side{display:flex;flex-direction:column;gap:16px}
.side .panel{padding:16px}
.side h3{margin-bottom:10px}
.toggle{display:flex;align-items:center;gap:8px;font-size:15px;cursor:pointer}
.toggle input{accent-color:var(--accent);width:18px;height:18px}
.overlay{position:absolute;inset:0;background:rgba(11,15,26,.72);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;padding:20px}
.bar{width:min(380px,80%);height:8px;border-radius:4px;background:rgba(255,255,255,.2);overflow:hidden}
.bar i{display:block;height:100%;background:var(--marker);width:0}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:10px;font-weight:600;z-index:50;max-width:90vw}
.objlist{margin:8px 0 0;padding-left:20px}
@media (max-width:900px){
  .editor,.studio{grid-template-columns:1fr}
  .scene-nav{position:static;max-height:none}
  .form{grid-template-columns:1fr}
  .beat{grid-template-columns:1fr}
}
</style>
</head>
<body>
<div id="app"></div>
<script>
"use strict";
/* =====================================================================
   CodeLesson AI — single-page studio
   Modules (in order): config & registries · utils · storage · validation
   · event DSL · AI generation · Python sandbox · timeline engine
   · canvas renderers · player & recorder · views · samples · boot
   ===================================================================== */

/* ---------- config & registries ---------- */
const W = 1280, H = 720;
const PLATFORMS = {
  python:   {id:'python',   label:'Python',             blurb:'Typed code, live output',      lang:'python',     file:'main.py',    color:'#3B7BD9', runs:true},
  scratch:  {id:'scratch',  label:'Scratch',            blurb:'Block scripts and a stage',     lang:null,         file:'',           color:'#FFAB19', blockSet:'scratch'},
  roblox:   {id:'roblox',   label:'Roblox / Luau',      blurb:'Scripts in a Studio-style view', lang:'luau',      file:'Script',     color:'#D9534F'},
  minecraft:{id:'minecraft',label:'Minecraft Education',blurb:'MakeCode blocks and the Agent', lang:'javascript', file:'main.ts',    color:'#5BA33B', blockSet:'makecode'}
};
const AGES = ['6–8 years','9–11 years','12–14 years','15–17 years'];
const DIFFICULTIES = ['Beginner','Intermediate','Advanced'];
const DURATIONS = [5,8,10,15,20];
const STYLES = ['Friendly','Story-based','Step-by-step','Interactive','Professional'];
const SCENE_TYPES = ['intro','explanation','demonstration','code_walkthrough','output','common_mistakes','practice','challenge','recap','quiz'];
const EVENT_TYPES = ['SHOW_TEXT','SHOW_CODE','TYPE_CODE','HIGHLIGHT_CODE','CLEAR_HIGHLIGHT','SHOW_BLOCK','HIGHLIGHT_BLOCK','SHOW_OUTPUT','MOVE_AGENT','TURN_AGENT','PLACE_BLOCK','DEMO','SHOW_CHALLENGE','SHOW_QUIZ','REVEAL_ANSWER'];
const SEQ_EVENTS = new Set(['TYPE_CODE','MOVE_AGENT','TURN_AGENT','PLACE_BLOCK','DEMO','SHOW_OUTPUT']);
const TEXT_STYLES = ['heading','bullet','callout','mistake','fix'];
const AGENT_DIRS = ['forward','back','left','right','up','down'];
const MC_BLOCKS = {stone:'#8C929C',planks:'#B98A4E',gold:'#E9C646',glass:'rgba(176,222,255,.55)',dirt:'#8B5A2B',wool:'#EDEDED',grass:'#6BAA3D',brick:'#A2493A'};
const DEMO_ACTIONS = {
  scratch:['move','turn','say','collect','set_var','change_var','go_to','hide','show'],
  roblox:['touch','disappear','spawn','color','jump'],
  minecraft:[], python:[]
};

/* Block registries. Add a block by adding one entry: shape is hat | stack | c | e (if/else) | cap.
   Label tokens: [ARG] text/dropdown input, (ARG) number input, <ARG> boolean input. */
const BLOCK_SETS = {
  scratch:{
    colors:{events:'#FFBF00',motion:'#4C97FF',looks:'#9966FF',sound:'#CF63CF',control:'#FFAB19',sensing:'#5CB1D6',operators:'#59C059',variables:'#FF8C1A',custom:'#FF6680'},
    blocks:{
      when_flag_clicked:{cat:'events',shape:'hat',label:'when ⚑ clicked'},
      when_key_pressed:{cat:'events',shape:'hat',label:'when [KEY] key pressed',def:{KEY:'space'}},
      when_sprite_clicked:{cat:'events',shape:'hat',label:'when this sprite clicked'},
      when_receive:{cat:'events',shape:'hat',label:'when I receive [MESSAGE]',def:{MESSAGE:'message1'}},
      broadcast:{cat:'events',shape:'stack',label:'broadcast [MESSAGE]',def:{MESSAGE:'message1'}},
      move_steps:{cat:'motion',shape:'stack',label:'move (STEPS) steps',def:{STEPS:'10'}},
      turn_right:{cat:'motion',shape:'stack',label:'turn ↻ (DEGREES) degrees',def:{DEGREES:'15'}},
      turn_left:{cat:'motion',shape:'stack',label:'turn ↺ (DEGREES) degrees',def:{DEGREES:'15'}},
      go_to_xy:{cat:'motion',shape:'stack',label:'go to x: (X) y: (Y)',def:{X:'0',Y:'0'}},
      glide_to_xy:{cat:'motion',shape:'stack',label:'glide (SECS) secs to x: (X) y: (Y)',def:{SECS:'1',X:'0',Y:'0'}},
      point_direction:{cat:'motion',shape:'stack',label:'point in direction (DIRECTION)',def:{DIRECTION:'90'}},
      bounce:{cat:'motion',shape:'stack',label:'if on edge, bounce'},
      say:{cat:'looks',shape:'stack',label:'say [MESSAGE]',def:{MESSAGE:'Hello!'}},
      say_for_secs:{cat:'looks',shape:'stack',label:'say [MESSAGE] for (SECS) seconds',def:{MESSAGE:'Hello!',SECS:'2'}},
      think:{cat:'looks',shape:'stack',label:'think [MESSAGE]',def:{MESSAGE:'Hmm...'}},
      next_costume:{cat:'looks',shape:'stack',label:'next costume'},
      show:{cat:'looks',shape:'stack',label:'show'},
      hide:{cat:'looks',shape:'stack',label:'hide'},
      change_size:{cat:'looks',shape:'stack',label:'change size by (CHANGE)',def:{CHANGE:'10'}},
      play_sound:{cat:'sound',shape:'stack',label:'start sound [SOUND]',def:{SOUND:'pop'}},
      wait:{cat:'control',shape:'stack',label:'wait (SECS) seconds',def:{SECS:'1'}},
      repeat:{cat:'control',shape:'c',label:'repeat (TIMES)',def:{TIMES:'10'}},
      forever:{cat:'control',shape:'c',cap:true,label:'forever'},
      if:{cat:'control',shape:'c',label:'if <CONDITION> then',def:{CONDITION:''}},
      if_else:{cat:'control',shape:'e',label:'if <CONDITION> then',def:{CONDITION:''}},
      repeat_until:{cat:'control',shape:'c',label:'repeat until <CONDITION>',def:{CONDITION:''}},
      wait_until:{cat:'control',shape:'stack',label:'wait until <CONDITION>',def:{CONDITION:''}},
      stop_all:{cat:'control',shape:'cap',label:'stop [OPTION]',def:{OPTION:'all'}},
      set_variable:{cat:'variables',shape:'stack',label:'set [VAR] to (VALUE)',def:{VAR:'score',VALUE:'0'}},
      change_variable:{cat:'variables',shape:'stack',label:'change [VAR] by (VALUE)',def:{VAR:'score',VALUE:'1'}},
      ask_and_wait:{cat:'sensing',shape:'stack',label:'ask [QUESTION] and wait',def:{QUESTION:"What's your name?"}}
    }
  },
  makecode:{
    colors:{player:'#0D7CC3',agent:'#D2481B',loops:'#1C9C3C',logic:'#5865B0',variables:'#C8264F',blocks:'#6D9C2E',positions:'#4E9C8C',custom:'#7A5CC2'},
    blocks:{
      on_start:{cat:'loops',shape:'hat',label:'on start'},
      on_chat:{cat:'player',shape:'hat',label:'on chat command [COMMAND]',def:{COMMAND:'run'}},
      player_say:{cat:'player',shape:'stack',label:'say [MESSAGE]',def:{MESSAGE:'Hi!'}},
      agent_move:{cat:'agent',shape:'stack',label:'agent move [DIRECTION] by (BLOCKS)',def:{DIRECTION:'forward',BLOCKS:'1'}},
      agent_turn:{cat:'agent',shape:'stack',label:'agent turn [DIRECTION]',def:{DIRECTION:'left'}},
      agent_place:{cat:'agent',shape:'stack',label:'agent place [DIRECTION]',def:{DIRECTION:'down'}},
      agent_destroy:{cat:'agent',shape:'stack',label:'agent destroy [DIRECTION]',def:{DIRECTION:'forward'}},
      agent_till:{cat:'agent',shape:'stack',label:'agent till [DIRECTION]',def:{DIRECTION:'forward'}},
      agent_set_item:{cat:'agent',shape:'stack',label:'agent set block or item [ITEM] count (COUNT) in slot (SLOT)',def:{ITEM:'stone',COUNT:'64',SLOT:'1'}},
      agent_place_on_move:{cat:'agent',shape:'stack',label:'agent place on move [ON]',def:{ON:'true'}},
      agent_teleport:{cat:'agent',shape:'stack',label:'agent teleport to player'},
      repeat:{cat:'loops',shape:'c',label:'repeat (TIMES) times',def:{TIMES:'4'}},
      while:{cat:'loops',shape:'c',label:'while <CONDITION>',def:{CONDITION:'true'}},
      for_range:{cat:'loops',shape:'c',label:'for (INDEX) from 0 to (END)',def:{INDEX:'index',END:'4'}},
      pause:{cat:'loops',shape:'stack',label:'pause (MS) ms',def:{MS:'100'}},
      if:{cat:'logic',shape:'c',label:'if <CONDITION> then',def:{CONDITION:'true'}},
      if_else:{cat:'logic',shape:'e',label:'if <CONDITION> then',def:{CONDITION:'true'}},
      set_variable:{cat:'variables',shape:'stack',label:'set [VAR] to (VALUE)',def:{VAR:'count',VALUE:'0'}},
      change_variable:{cat:'variables',shape:'stack',label:'change [VAR] by (VALUE)',def:{VAR:'count',VALUE:'1'}},
      place_block:{cat:'blocks',shape:'stack',label:'place [BLOCK] at (POSITION)',def:{BLOCK:'stone',POSITION:'~0 ~0 ~0'}},
      fill_blocks:{cat:'blocks',shape:'stack',label:'fill with [BLOCK] from (FROM) to (TO)',def:{BLOCK:'stone',FROM:'~0 ~0 ~0',TO:'~3 ~0 ~3'}}
    }
  }
};

/* ---------- utils ---------- */
const $ = (s, el=document) => el.querySelector(s);
const $$ = (s, el=document) => [...el.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const uid = (p='l') => p + '_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const words = s => (String(s||'').trim().match(/\S+/g) || []).length;
const fmtTime = s => { s = Math.max(0, s); const m = Math.floor(s/60), r = Math.floor(s%60); return m + ':' + String(r).padStart(2,'0'); };
const deepClone = o => JSON.parse(JSON.stringify(o));
const ease = p => p<.5 ? 2*p*p : 1 - Math.pow(-2*p+2, 2)/2;
function debounce(fn, ms){ let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; }
function toast(msg){ const el = document.createElement('div'); el.className='toast'; el.setAttribute('role','status'); el.textContent=msg; document.body.appendChild(el); setTimeout(()=>el.remove(), 3200); }
function codeLines(code){ return String(code||'').replace(/\t/g,'    ').replace(/\r/g,'').split('\n'); }

/* ---------- server API & storage ---------- */
const Server = {config:null};
async function api(method, url, body, opts={}){
  let res;
  try {
    res = await fetch(url, {method, credentials:'same-origin', signal:opts.signal,
      headers: body !== undefined ? {'content-type':'application/json'} : {},
      body: body !== undefined ? JSON.stringify(body) : undefined});
  } catch (e) {
    if (e && e.name === 'AbortError') throw {code:'cancelled', message:'Cancelled.'};
    throw Object.assign(new Error('Could not reach the server. Check your connection.'), {code:'network'});
  }
  let data = null; try { data = await res.json(); } catch {}
  if (!res.ok){
    const e = new Error((data && data.message) || `Request failed (${res.status})`);
    e.code = (data && data.code) || 'http_' + res.status; e.text = data && data.text; e.status = res.status;
    if (res.status === 401 && !opts.noAuthRedirect) onUnauthorized();
    throw e;
  }
  return data;
}
function onUnauthorized(){ if (App.view !== 'auth'){ App.profile = null; go('auth', {authMode:'login'}); toast('Your session ended. Log in again.'); } }
const Store = {
  async loadAll(){ const r = await api('GET', '/api/lessons'); const lessons = {}; for (const l of r.lessons) lessons[l.id] = l; return {lessons}; },
  async saveLesson(lesson){ try { await api('PUT', '/api/lessons/' + encodeURIComponent(lesson.id), {lesson:stripRuntime(lesson)}); } catch (e) { if (e.status !== 401) toast('Could not save: ' + e.message); } },
  async deleteLesson(id){ await api('DELETE', '/api/lessons/' + encodeURIComponent(id)); }
};
function stripRuntime(lesson){
  return JSON.parse(JSON.stringify(lesson, (k, v) => k.startsWith('_') ? undefined : v));
}

/* ---------- validation & repair ---------- */
function blockRegistry(platform){ const k = PLATFORMS[platform]?.blockSet; return k ? BLOCK_SETS[k] : null; }

function normalizeBlocks(list, platform, ctx){
  const reg = blockRegistry(platform);
  const out = [];
  for (const raw of (Array.isArray(list) ? list : [])){
    if (!raw || typeof raw !== 'object') continue;
    const b = {id:String(raw.id || ''), name:String(raw.name || 'custom'), args:{}, children:[], else:[]};
    if (!b.id || ctx.ids.has(b.id)){ b.id = 'b' + (++ctx.n); while (ctx.ids.has(b.id)) b.id = 'b' + (++ctx.n); }
    ctx.ids.add(b.id);
    if (raw.args && typeof raw.args === 'object') for (const [k, v] of Object.entries(raw.args)) b.args[String(k).toUpperCase()] = String(v);
    if (!reg || !reg.blocks[b.name]){
      if (b.name !== 'custom') ctx.warn.push(`Block "${b.name}" isn't in the ${platform} block set — shown with its label as a custom block.`);
      b.label = String(raw.label || raw.text || b.name.replace(/_/g,' '));
      b.category = String(raw.category || 'custom');
      b.shape = ['hat','stack','c','e','cap'].includes(raw.shape) ? raw.shape : ((raw.children||[]).length ? 'c' : 'stack');
      b.name = 'custom';
    }
    b.children = normalizeBlocks(raw.children, platform, ctx);
    b.else = normalizeBlocks(raw.else, platform, ctx);
    out.push(b);
  }
  return out;
}
function allBlockIds(blocks, acc=[]){ for (const b of blocks){ acc.push(b.id); allBlockIds(b.children, acc); allBlockIds(b.else, acc); } return acc; }
function parseLineList(v, n){
  let arr = Array.isArray(v) ? v : (v == null ? [] : [v]);
  const out = [];
  for (const x of arr){
    if (typeof x === 'string' && /^\d+\s*-\s*\d+$/.test(x)){ const [a,b] = x.split('-').map(Number); for (let i=a;i<=b;i++) out.push(i); }
    else { const k = parseInt(x, 10); if (!isNaN(k)) out.push(k); }
  }
  return [...new Set(out)].filter(k => k >= 1 && k <= n).sort((a,b)=>a-b);
}

function normalizeEvent(ev, scene, platform, warn, nLines, blockIds){
  if (!ev || typeof ev !== 'object') return null;
  const type = String(ev.type || '').toUpperCase().trim();
  if (!EVENT_TYPES.includes(type)){ warn.push(`Removed unknown event "${ev.type}".`); return null; }
  const e = {type};
  if (ev.at != null && !isNaN(+ev.at)) e.at = clamp(+ev.at, 0, 1);
  switch (type){
    case 'SHOW_TEXT': e.text = String(ev.text || '').trim(); if (!e.text) return null; e.style = TEXT_STYLES.includes(ev.style) ? ev.style : 'bullet'; break;
    case 'SHOW_CODE': case 'TYPE_CODE': case 'HIGHLIGHT_CODE': {
      if (!nLines){ warn.push(`${type} needs code in this scene — removed.`); return null; }
      const req = ev.lines ?? ev.line;
      e.lines = parseLineList(req, nLines);
      if (type !== 'SHOW_CODE' && !e.lines.length){
        if (type === 'TYPE_CODE' && req == null) e.lines = Array.from({length:nLines}, (_, i) => i+1);
        else { warn.push(`${type} pointed at lines that don't exist — removed.`); return null; }
      }
      if (type === 'SHOW_CODE' && !e.lines.length) delete e.lines;
      if (type === 'HIGHLIGHT_CODE' && ev.match) e.match = String(ev.match);
      break;
    }
    case 'SHOW_BLOCK': case 'HIGHLIGHT_BLOCK':
      e.block_id = String(ev.block_id || ev.id || '');
      if (!blockIds.has(e.block_id)){ warn.push(`${type} refers to missing block "${e.block_id}" — removed.`); return null; }
      break;
    case 'SHOW_OUTPUT': break;
    case 'MOVE_AGENT': e.direction = AGENT_DIRS.includes(String(ev.direction).toLowerCase()) ? String(ev.direction).toLowerCase() : 'forward'; e.steps = clamp(parseInt(ev.steps, 10) || 1, 1, 12); break;
    case 'TURN_AGENT': e.direction = String(ev.direction).toLowerCase() === 'right' ? 'right' : 'left'; break;
    case 'PLACE_BLOCK': e.block = MC_BLOCKS[String(ev.block).toLowerCase()] ? String(ev.block).toLowerCase() : 'stone'; e.direction = String(ev.direction).toLowerCase() === 'forward' ? 'forward' : 'down'; break;
    case 'DEMO':
      e.action = String(ev.action || '').toLowerCase();
      if (!(DEMO_ACTIONS[platform] || []).includes(e.action)){ warn.push(`Demo action "${ev.action}" isn't available for ${PLATFORMS[platform].label} — removed.`); return null; }
      if (ev.value != null) e.value = String(ev.value);
      break;
    case 'SHOW_CHALLENGE': e.text = String(ev.text || '').trim(); if (!e.text) return null; break;
    case 'SHOW_QUIZ': case 'REVEAL_ANSWER': e.index = Math.max(1, parseInt(ev.index, 10) || 1); break;
    case 'CLEAR_HIGHLIGHT': break;
  }
  return e;
}

/* Validates one scene in place. Returns {errors, warnings}. Errors are fatal (AI repair needed). */
function validateScene(scene, platform, quizLen=0){
  const warn = [], errors = [];
  if (!scene || typeof scene !== 'object') return {errors:['Scene is not an object.'], warnings:[]};
  scene.scene_id = String(scene.scene_id || uid('scene'));
  scene.scene_type = SCENE_TYPES.includes(scene.scene_type) ? scene.scene_type : 'explanation';
  scene.title = String(scene.title || 'Untitled scene');
  scene.visual_description = String(scene.visual_description || '');
  scene.code = typeof scene.code === 'string' ? scene.code.replace(/\t/g,'    ').replace(/\r/g,'').replace(/\n+$/,'') : '';
  scene.expected_output = typeof scene.expected_output === 'string' ? scene.expected_output.replace(/\r/g,'') : '';
  const ctx = {ids:new Set(), n:0, warn};
  scene.blocks = normalizeBlocks(scene.blocks, platform, ctx);
  const nLines = scene.code ? codeLines(scene.code).length : 0;
  const blockIds = new Set(allBlockIds(scene.blocks));
  if (!Array.isArray(scene.beats)) scene.beats = [];
  scene.beats = scene.beats.filter(b => b && typeof b === 'object').map(b => ({
    narration: String(b.narration || '').trim(),
    events: (Array.isArray(b.events) ? b.events : []).map(e => normalizeEvent(e, scene, platform, warn, nLines, blockIds)).filter(Boolean)
  })).filter(b => b.narration || b.events.length);
  if (!scene.beats.some(b => b.narration)) errors.push(`Scene "${scene.title}" has no narration.`);

  // Make sure anything highlighted is on screen first; make sure code/blocks appear at all.
  const shownLines = new Set(), shownBlocks = new Set();
  const parents = {}; (function walk(list, p){ for (const b of list){ parents[b.id] = p; walk(b.children, b.id); walk(b.else, b.id); } })(scene.blocks, null);
  for (const b of scene.beats){
    const fixed = [];
    for (const e of b.events){
      if (e.type === 'SHOW_CODE'){ (e.lines || Array.from({length:nLines},(_, i)=>i+1)).forEach(l => shownLines.add(l)); }
      if (e.type === 'TYPE_CODE') e.lines.forEach(l => shownLines.add(l));
      if (e.type === 'HIGHLIGHT_CODE'){
        const missing = e.lines.filter(l => !shownLines.has(l));
        if (missing.length){ fixed.push({type:'SHOW_CODE', lines:missing}); missing.forEach(l => shownLines.add(l)); warn.push(`Highlighted line ${missing.join(', ')} before it was shown — it now appears first.`); }
        if (e.match){ const ok = e.lines.some(l => codeLines(scene.code)[l-1].includes(e.match)); if (!ok){ warn.push(`"${e.match}" isn't on line ${e.lines.join(', ')} — highlighting the whole line instead.`); delete e.match; } }
      }
      if (e.type === 'SHOW_BLOCK' || e.type === 'HIGHLIGHT_BLOCK'){
        const chain = []; let p = parents[e.block_id];
        while (p){ if (!shownBlocks.has(p)) chain.unshift(p); p = parents[p]; }
        for (const id of chain){ fixed.push({type:'SHOW_BLOCK', block_id:id}); shownBlocks.add(id); }
        if (e.type === 'HIGHLIGHT_BLOCK' && !shownBlocks.has(e.block_id)){ fixed.push({type:'SHOW_BLOCK', block_id:e.block_id}); }
        shownBlocks.add(e.block_id);
      }
      if (e.type === 'SHOW_OUTPUT' && !scene.code && !scene.expected_output){ warn.push('SHOW_OUTPUT has no code or expected output — removed.'); continue; }
      if ((e.type === 'SHOW_QUIZ' || e.type === 'REVEAL_ANSWER') && quizLen && e.index > quizLen){ warn.push(`Quiz question ${e.index} doesn't exist — removed.`); continue; }
      fixed.push(e);
    }
    b.events = fixed;
  }
  if (nLines && !shownLines.size && scene.beats.length){ scene.beats[0].events.unshift({type:'SHOW_CODE'}); warn.push('Code was never shown — it now appears at the start of the scene.'); }
  if (blockIds.size && !shownBlocks.size && scene.beats.length){
    scene.beats[0].events.unshift(...allBlockIds(scene.blocks).map(id => ({type:'SHOW_BLOCK', block_id:id})));
    warn.push('Blocks were never shown — they now appear at the start of the scene.');
  }
  return {errors, warnings:[...new Set(warn)]};
}

function validateLesson(lesson){
  const errors = [], warnings = [];
  if (!lesson || typeof lesson !== 'object') return {errors:['Lesson is not an object.'], warnings};
  lesson.platform = PLATFORMS[lesson.platform] ? lesson.platform : 'python';
  lesson.lesson_title = String(lesson.lesson_title || '').trim() || 'Untitled lesson';
  for (const k of ['learning_objectives','prerequisites']) lesson[k] = (Array.isArray(lesson[k]) ? lesson[k] : []).map(String).filter(Boolean);
  lesson.common_mistakes = (Array.isArray(lesson.common_mistakes) ? lesson.common_mistakes : []).map(m => typeof m === 'string' ? {mistake:m, fix:''} : {mistake:String(m?.mistake||''), fix:String(m?.fix||'')}).filter(m => m.mistake);
  for (const k of ['practice_activity','challenge','recap']) lesson[k] = String(lesson[k] || '');
  lesson.quiz = (Array.isArray(lesson.quiz) ? lesson.quiz : []).map(q => {
    const options = (Array.isArray(q?.options) ? q.options : []).map(String).slice(0, 4);
    while (options.length < 2) options.push('—');
    return {question:String(q?.question||''), options, answer_index:clamp(parseInt(q?.answer_index,10)||0, 0, options.length-1), explanation:String(q?.explanation||'')};
  }).filter(q => q.question);
  if (!Array.isArray(lesson.scenes) || !lesson.scenes.length) errors.push('Lesson has no scenes.');
  else for (const s of lesson.scenes){ const r = validateScene(s, lesson.platform, lesson.quiz.length); errors.push(...r.errors); warnings.push(...r.warnings); }
  return {errors, warnings};
}

/* ---------- event DSL (how teachers edit sync events) ----------
   One event per line, e.g.  TYPE_CODE 1-2   HIGHLIGHT_CODE 2 "range(5)"   MOVE_AGENT forward 3 @0.5 */
function q(s){ return '"' + String(s).replace(/"/g, '\\"') + '"'; }
function lineSpec(lines){
  if (!lines || !lines.length) return '';
  const parts = []; let a = lines[0], b = lines[0];
  for (let i = 1; i <= lines.length; i++){
    if (lines[i] === b + 1) b = lines[i];
    else { parts.push(a === b ? String(a) : a + '-' + b); a = b = lines[i]; }
  }
  return parts.join(',');
}
function eventToDSL(e){
  let s = e.type;
  switch (e.type){
    case 'SHOW_TEXT': s += (e.style && e.style !== 'bullet' ? ' ' + e.style : '') + ' ' + q(e.text); break;
    case 'SHOW_CODE': case 'TYPE_CODE': if (e.lines) s += ' ' + lineSpec(e.lines); break;
    case 'HIGHLIGHT_CODE': s += ' ' + lineSpec(e.lines) + (e.match ? ' ' + q(e.match) : ''); break;
    case 'SHOW_BLOCK': case 'HIGHLIGHT_BLOCK': s += ' ' + e.block_id; break;
    case 'MOVE_AGENT': s += ' ' + e.direction + ' ' + e.steps; break;
    case 'TURN_AGENT': s += ' ' + e.direction; break;
    case 'PLACE_BLOCK': s += ' ' + e.block + ' ' + e.direction; break;
    case 'DEMO': s += ' ' + e.action + (e.value != null ? ' ' + q(e.value) : ''); break;
    case 'SHOW_CHALLENGE': s += ' ' + q(e.text); break;
    case 'SHOW_QUIZ': case 'REVEAL_ANSWER': s += ' ' + e.index; break;
  }
  if (e.at != null) s += ' @' + (+e.at).toFixed(2).replace(/0+$/,'').replace(/\.$/,'');
  return s;
}
function tokenizeDSL(line){
  const out = []; const re = /"((?:[^"\\]|\\.)*)"|(\S+)/g; let m;
  while ((m = re.exec(line))) out.push(m[1] != null ? {s:m[1].replace(/\\"/g,'"'), quoted:true} : {s:m[2], quoted:false});
  return out;
}
function parseDSL(text){
  const events = [], errors = [];
  String(text||'').split('\n').forEach((raw, i) => {
    const line = raw.trim(); if (!line || line.startsWith('#')) return;
    const toks = tokenizeDSL(line);
    let at; const last = toks[toks.length-1];
    if (last && !last.quoted && /^@[\d.]+$/.test(last.s)){ at = parseFloat(last.s.slice(1)); toks.pop(); }
    const type = toks.shift().s.toUpperCase();
    const rest = toks;
    if (!EVENT_TYPES.includes(type)){ errors.push(`Line ${i+1}: "${type}" isn't an event type.`); return; }
    const e = {type};
    const str = () => (rest.find(t => t.quoted) || {}).s;
    const bare = () => rest.filter(t => !t.quoted).map(t => t.s);
    switch (type){
      case 'SHOW_TEXT': { const b = bare(); e.style = TEXT_STYLES.includes(b[0]) ? b[0] : 'bullet'; e.text = str(); if (!e.text){ errors.push(`Line ${i+1}: put the text in quotes.`); return; } break; }
      case 'SHOW_CODE': case 'TYPE_CODE': case 'HIGHLIGHT_CODE': {
        const b = bare(); if (b[0]) e.lines = b[0].split(',').flatMap(p => p.includes('-') ? [p] : [p]);
        if (type === 'HIGHLIGHT_CODE'){ if (!b[0]){ errors.push(`Line ${i+1}: say which line to highlight.`); return; } const m = str(); if (m) e.match = m; }
        break; }
      case 'SHOW_BLOCK': case 'HIGHLIGHT_BLOCK': e.block_id = bare()[0]; if (!e.block_id){ errors.push(`Line ${i+1}: add a block id like b1.`); return; } break;
      case 'MOVE_AGENT': { const b = bare(); e.direction = b[0]; e.steps = b[1]; break; }
      case 'TURN_AGENT': e.direction = bare()[0]; break;
      case 'PLACE_BLOCK': { const b = bare(); e.block = b[0]; e.direction = b[1]; break; }
      case 'DEMO': { const b = bare(); e.action = b[0]; const v = str() ?? b[1]; if (v != null) e.value = v; break; }
      case 'SHOW_CHALLENGE': e.text = str(); if (!e.text){ errors.push(`Line ${i+1}: put the challenge in quotes.`); return; } break;
      case 'SHOW_QUIZ': case 'REVEAL_ANSWER': e.index = bare()[0]; break;
    }
    if (at != null && !isNaN(at)) e.at = at;
    events.push(e);
  });
  return {events, errors};
}

function aiErrorCopy(e){
  const c = e && e.code;
  if (c === 'rate_limited') return 'Too many AI requests right now. Wait a minute, then try again.';
  if (c === 'quota') return e.message;
  if (c === 'cancelled') return 'Generation stopped.';
  if (c === 'invalid_json') return 'The AI returned a lesson that could not be read, even after a repair attempt. Try again, or shorten the lesson.';
  if (c === 'unavailable' || c === 'ai_not_configured') return `Lesson generation is not set up on this server. Add ${aiKeyName()} to the .env file and restart the server. Sample lessons still work.`;
  if (c === 'ai_bad_key') return `The server\u2019s AI key was rejected. Check ${aiKeyName()} in .env.`;
  if (c === 'rate_limited' && Server.config && Server.config.aiProvider === 'gemini') return 'Gemini\u2019s free tier is busy or its per-minute limit was reached. Wait a minute, then try again.';
  if (c === 'network') return e.message;

}

${blockList}
- Boolean inputs <CONDITION> take text such as "touching Coin?" or "key space pressed?".

- DEMO actions animate the stage: "move" (value: steps), "turn" (degrees), "say" (text), "collect" (sprite touches the coin), "set_var" (value "score=0"), "change_var" (value "score+1"), "go_to" ("x,y"), "hide", "show".

    case 'minecraft': return `PLATFORM: Minecraft Education Edition with Microsoft MakeCode (blocks + MakeCode JavaScript). This is about coding the Agent and player in Minecraft Education, not general game development.
- "blocks" is a list of MakeCode scripts. Each block: {"id":"b1","name":"<registry name>","args":{"ARG":"value"},"children":[...],"else":[...]}.
- Block registry (use these names and ARG keys exactly):
${blockList}
- "code" is the equivalent MakeCode JavaScript, e.g.
  player.onChat("tower", function () {
      for (let i = 0; i < 4; i++) {
          agent.place(DOWN)

      }
  })
  Valid APIs: player.onChat, player.say, agent.move(FORWARD|BACK|LEFT|RIGHT|UP|DOWN, n), agent.turn(LEFT_TURN|RIGHT_TURN), agent.place(FORWARD|DOWN), agent.destroy(FORWARD), agent.setItem(STONE, 64, 1), agent.setAssist(PLACE_ON_MOVE, true), agent.teleportToPlayer(), loops.pause(ms). At most 14 lines.

Rules: about ${nScenes} scenes whose duration_seconds add up to about ${secs}. Scene types (in a sensible order) must include intro, explanation, several demonstration or code_walkthrough scenes, output, common_mistakes, practice, challenge, recap, quiz. Allowed scene_type values: ${SCENE_TYPES.join(', ')}. 3 common mistakes, 4 quiz questions. Language and examples must suit ${f.age}.`;
}

function scenePrompt(f, outline, sc, idx, instruction){
  const wordsTarget = Math.round((sc.duration_seconds || 30) * 2.5);
  const list = outline.scenes.map((s, i) => `${i+1}. [${s.scene_type}] ${s.title} — ${s.goal || ''}`).join('\n');
  let extra = '';
  if (sc.scene_type === 'quiz') extra = 'QUIZ (use SHOW_QUIZ / REVEAL_ANSWER with these question numbers; read each question, pause, reveal):\n' + outline.quiz.map((qq, i) => `${i+1}. ${qq.question} | options: ${qq.options.join(' / ')} | answer: ${qq.options[qq.answer_index]}`).join('\n');
  if (sc.scene_type === 'challenge') extra = 'CHALLENGE TEXT (show with SHOW_CHALLENGE): ' + outline.challenge;
  if (sc.scene_type === 'common_mistakes') extra = 'COMMON MISTAKES: ' + outline.common_mistakes.map(m => m.mistake + ' → ' + m.fix).join(' | ') + '\nYou may show a short buggy snippet as code and then explain the fix.';
  if (sc.scene_type === 'practice') extra = 'PRACTICE ACTIVITY: ' + outline.practice_activity;
  if (sc.scene_type === 'recap') extra = 'RECAP: ' + outline.recap;
  return `You are writing ONE scene of a narrated coding lesson video. The narration is read aloud by a voice; everything on screen is driven by timed events.

LESSON: "${outline.lesson_title}" for ${f.age}, ${f.difficulty}, style: ${f.style}.
${platformGuide(f.platform)}

FINAL PROGRAM THE LESSON BUILDS:
${outline.final_program || '(not specified)'}

ALL SCENES:
${list}

WRITE SCENE ${idx+1}: [${sc.scene_type}] "${sc.title}" — ${sc.goal || ''}
Narration length: about ${wordsTarget} words in total, split into beats of 1–2 sentences (8–30 words each). Speak directly to the student in a ${f.style.toLowerCase()} tone.
${extra}
${instruction ? 'TEACHER INSTRUCTION FOR THIS SCENE: ' + instruction : ''}

${EVENT_DOC}

Scenes without code (intro, explanation, recap) should use SHOW_TEXT: one heading then 2–4 short bullets, each appearing in the beat that mentions it.

Reply with only this JSON object:
{"scene_id":"${sc.scene_id}","scene_type":"${sc.scene_type}","title":"${String(sc.title).replace(/"/g,"'")}","visual_description":"one sentence describing the screen","code":"","blocks":[],"expected_output":"","beats":[{"narration":"...","events":[...]}]}`;
}

function validateOutline(o){
  const e = [];
  if (!o || typeof o !== 'object') return ['Reply was not a JSON object.'];
  if (!o.lesson_title) e.push('Missing lesson_title.');
  if (!Array.isArray(o.scenes) || o.scenes.length < 3) e.push('scenes must list at least 3 scenes.');
  else o.scenes.forEach((s, i) => { if (!s.title) e.push(`Scene ${i+1} needs a title.`); if (!SCENE_TYPES.includes(s.scene_type)) e.push(`Scene ${i+1} has an invalid scene_type "${s.scene_type}".`); });
  if (!Array.isArray(o.quiz)) e.push('quiz must be an array.');
  return e;
}

async function sampleJsonRepaired(prompt, validate, opts={}){
  const sample = await getSample();
  if (!sample) throw {code:'unavailable'};
  let lastText = '', problems = [];
  for (let attempt = 0; attempt < 2; attempt++){
    const p = attempt === 0 ? prompt : prompt + `\n\nYOUR PREVIOUS REPLY HAD PROBLEMS:\n- ${problems.join('\n- ')}\n${lastText ? 'Previous reply (start):\n' + lastText.slice(0, 3000) + '\n' : ''}Return the complete corrected JSON object only.`;
    try {
      const obj = await sample.json(p, {modelTier:'default', signal:opts.signal, cache: attempt === 0 && !opts.noCache});
      problems = validate(obj);
      if (!problems.length) return obj;
      lastText = JSON.stringify(obj);
    } catch (e) {
      if (e && e.code === 'invalid_json'){ problems = ['The reply was not valid JSON (or was cut off). Keep it shorter.']; lastText = e.text || ''; continue; }
      throw e;
    }
  }
  const err = new Error(problems.join(' ')); err.code = 'invalid_json'; throw err;
}

async function generateScene(form, outline, sc, idx, opts={}){
  const platform = form.platform;
  const obj = await sampleJsonRepaired(scenePrompt(form, outline, sc, idx, opts.instruction), o => {
    if (!o || typeof o !== 'object') return ['Reply was not a JSON object.'];
    const copy = deepClone(o);
    const r = validateScene(copy, platform, outline.quiz.length);
    const errs = [...r.errors];
    if (!Array.isArray(o.beats) || !o.beats.length) errs.push('beats must be a non-empty array.');
    if (platform === 'scratch' && ['demonstration','code_walkthrough'].includes(sc.scene_type) && !(o.blocks||[]).length) errs.push('This scene must include Scratch blocks.');
    if (['python','roblox'].includes(platform) && ['demonstration','code_walkthrough','output'].includes(sc.scene_type) && !String(o.code||'').trim()) errs.push('This scene must include code.');
    return errs;
  }, opts);
  obj.scene_id = sc.scene_id; obj.scene_type = sc.scene_type;
  if (!obj.title) obj.title = sc.title;
  const r = validateScene(obj, platform, outline.quiz.length);
  obj._warnings = r.warnings;
  return obj;
}

async function generateLesson(form, onStep, signal){
  onStep({key:'plan', state:'run', label:'Planning the lesson', sub:'Objectives, scene plan, quiz and challenge'});
  const outline = await sampleJsonRepaired(outlinePrompt(form), validateOutline, {signal});
  outline.scenes.forEach((s, i) => { s.scene_id = 'scene_' + (i+1); });
  const tmp = {platform:form.platform, lesson_title:outline.lesson_title, quiz:outline.quiz, common_mistakes:outline.common_mistakes, learning_objectives:outline.learning_objectives, prerequisites:outline.prerequisites,
    practice_activity:outline.practice_activity, challenge:outline.challenge, recap:outline.recap, scenes:[{beats:[{narration:'x'}]}]};
  validateLesson(tmp);
  for (const k of ['quiz','common_mistakes','learning_objectives','prerequisites','practice_activity','challenge','recap']) outline[k] = tmp[k];
  onStep({key:'plan', state:'done', label:'Planned: ' + outline.lesson_title, sub:outline.scenes.length + ' scenes'});
  outline.scenes.forEach((s, i) => onStep({key:s.scene_id, state:'wait', label:`Scene ${i+1}: ${s.title}`, sub:s.scene_type.replace('_',' ')}));
  const scenes = new Array(outline.scenes.length);
  let next = 0; const failures = [];
  async function worker(){
    while (next < outline.scenes.length){
      const i = next++; const s = outline.scenes[i];
      if (signal && signal.aborted) return;
      onStep({key:s.scene_id, state:'run'});
      try { scenes[i] = await generateScene(form, outline, s, i, {signal}); onStep({key:s.scene_id, state:'done', sub:(scenes[i].beats.length) + ' beats' + (scenes[i]._warnings.length ? ' · ' + scenes[i]._warnings.length + ' auto-fixes' : '')}); }
      catch (e) {
        if (e && e.code === 'cancelled') throw e;
        failures.push(s.title);
        scenes[i] = {scene_id:s.scene_id, scene_type:s.scene_type, title:s.title, code:'', blocks:[], expected_output:'', beats:[{narration:`This scene still needs content: ${s.goal || s.title}.`, events:[{type:'SHOW_TEXT', style:'heading', text:s.title}]}], _warnings:['AI could not write this scene. Use "Rewrite with AI" or edit it by hand.']};
        onStep({key:s.scene_id, state:'fail', sub:aiErrorCopy(e)});
      }
    }
  }
  const n = clamp((Server.config && Server.config.aiConcurrency) || 2, 1, 4);
  await Promise.all(Array.from({length:n}, worker));
  const lesson = {
    id: uid('l'), createdAt: Date.now(), updatedAt: Date.now(),
    platform: form.platform, grade: form.age, difficulty: form.difficulty.toLowerCase(), duration_minutes: form.duration,
    topic: form.topic, teaching_style: form.style, form,
    lesson_title: outline.lesson_title, learning_objectives: outline.learning_objectives, prerequisites: outline.prerequisites,
    final_program: String(outline.final_program || ''),
    scenes, common_mistakes: outline.common_mistakes, practice_activity: outline.practice_activity,
    challenge: outline.challenge, recap: outline.recap, quiz: outline.quiz
  };
  validateLesson(lesson);
  return {lesson, failures};
}

/* ---------- Python sandbox ----------
   Code is executed by the server's sandbox container: no network, read-only filesystem, CPU / memory /
   process / output limits, a wall-clock timeout, and an unprivileged user. Nothing runs in the web server process. */
const runCache = new Map();
async function runPython(code){
  if (runCache.has(code)) return runCache.get(code);
  if (!Server.config || !Server.config.sandbox) return {ok:false, unavailable:true, output:'', error:'Python execution is not available on this server.', source:'none'};
  try {
    const r = await api('POST', '/api/run', {code});
    const res = {ok:!!r.ok, output:r.stdout || '', error:(r.stderr || '').trim(), source:'sandbox'};
    runCache.set(code, res); return res;
  } catch (e) { return {ok:false, unavailable:true, output:'', error:e.message, source:'none'}; }
}
function sceneOutput(lesson, scene){
  if (lesson.platform === 'python' && scene.code){
    const r = runCache.get(scene.code);
    if (r && !r.unavailable) return {text: (r.output || '') + (r.error ? (r.output ? '\n' : '') + r.error : ''), error:!r.ok, label:'Output'};
  }
  return {text: scene.expected_output || '', error:false, label: lesson.platform === 'python' ? 'Expected output' : 'Output'};
}
async function prepareOutputs(lesson){
  if (lesson.platform !== 'python') return;
  for (const s of lesson.scenes) if (s.code && s.beats.some(b => b.events.some(e => e.type === 'SHOW_OUTPUT'))) await runPython(s.code);
}

/* ---------- timeline engine ---------- */
function evDuration(e, lines){
  switch (e.type){
    case 'TYPE_CODE': { const n = e.lines.reduce((a, l) => a + (lines[l-1] || '').length + 1, 0); return clamp(n / 22, 0.5, 7); }
    case 'MOVE_AGENT': return Math.max(0.45, e.steps * 0.45);
    case 'TURN_AGENT': return 0.5;
    case 'PLACE_BLOCK': return 0.45;
    case 'SHOW_OUTPUT': return 1.2;
    case 'DEMO': return ({move:0.9, turn:0.5, collect:1.4, touch:1.6, jump:0.7, go_to:0.9}[e.action]) || 0.45;
    case 'HIGHLIGHT_CODE': case 'HIGHLIGHT_BLOCK': return 0.35;
    default: return 0.35;
  }
}
function chunkNarration(text){
  const ws = String(text||'').trim().split(/\s+/).filter(Boolean);
  if (!ws.length) return [];
  const chunks = []; let cur = [];
  for (const w of ws){
    cur.push(w);
    if (cur.length >= 13 || (cur.length >= 6 && /[.!?;:]$/.test(w))){ chunks.push(cur.join(' ')); cur = []; }
  }
  if (cur.length) chunks.push(cur.join(' '));
  const total = ws.length; let acc = 0;
  return chunks.map(c => { const n = words(c); const r = {text:c, from:acc/total, to:(acc+n)/total}; acc += n; return r; });
}
function compileLesson(lesson, wps=2.6){
  const tl = {scenes:[], total:0}; let t = 0;
  lesson.scenes.forEach((scene, si) => {
    const lines = scene.code ? codeLines(scene.code) : [];
    const c = {scene, index:si, start:t, events:[], beats:[], lines};
    t += 0.5;
    for (const b of scene.beats){
      const ad = VoiceAI.duration(b.narration);
      const speak = ad ? ad + 0.3 : (b.narration ? words(b.narration) / wps + 0.35 : 0.8);
      let cursor = t; const evs = [];
      for (const e of b.events){
        const dur = evDuration(e, lines);
        const time = e.at != null ? t + e.at * speak : cursor;
        evs.push(Object.assign({}, e, {time, dur}));
        cursor = SEQ_EVENTS.has(e.type) ? Math.max(cursor, time + dur) : Math.max(cursor, time);
      }
      const end = Math.max(t + speak, cursor + 0.3);
      c.beats.push({start:t, end, speak, narration:b.narration, chunks:chunkNarration(b.narration)});
      c.events.push(...evs);
      t = end;
    }
    t += 0.7;
    c.end = t;
    c.events.sort((a, b) => a.time - b.time);
    tl.scenes.push(c);
  });
  tl.total = t;
  return tl;
}
function sceneAt(tl, T){
  let c = tl.scenes[0];
  for (const s of tl.scenes){ if (s.start <= T) c = s; else break; }
  return c;
}
function beatAt(c, T){ for (const b of c.beats) if (T >= b.start && T < b.end) return b; return null; }

const DIRV = [[0,-1],[1,0],[0,1],[-1,0]];
function sceneStateAt(c, T){
  const n = c.lines.length;
  const st = {
    texts:[], revealed:new Array(n).fill(0), cursor:null, hl:null,
    blocks:new Map(), bhl:null, output:null,
    agent:{x:2, y:3, z:0, dir:1, rot:90}, placed:[],
    sprite:{x:-150, y:-40, dir:90, say:'', visible:true, coin:true, vars:{}},
    rbx:{charX:0, coin:1, color:null, jump:0},
    challenge:null, quiz:null, reveal:null, lastTypeEnd:-1
  };
  const fullLines = ls => (ls || Array.from({length:n}, (_, i) => i+1)).forEach(l => { st.revealed[l-1] = (c.lines[l-1] || '').length + 1; });
  for (const e of c.events){
    if (e.time > T) break;
    const p = e.dur ? clamp((T - e.time) / e.dur, 0, 1) : 1;
    switch (e.type){
      case 'SHOW_TEXT': st.texts.push({text:e.text, style:e.style, t0:e.time}); break;
      case 'SHOW_CODE': fullLines(e.lines); break;
      case 'TYPE_CODE': {
        const total = e.lines.reduce((a, l) => a + (c.lines[l-1] || '').length + 1, 0);
        let k = Math.floor(total * p);
        for (const l of e.lines){
          const len = (c.lines[l-1] || '').length + 1;
          const take = Math.min(len, k);
          st.revealed[l-1] = Math.max(st.revealed[l-1], take);
          if (p < 1 && take < len && take >= 0 && k >= 0){ st.cursor = {line:l-1, col:Math.min(take, len-1)}; k = -1; break; }
          k -= take;
        }
        if (p >= 1){ const last = e.lines[e.lines.length-1]; st.cursor = {line:last-1, col:(c.lines[last-1]||'').length, idle:true}; }
        break;
      }
      case 'HIGHLIGHT_CODE': fullLines(e.lines); st.hl = {lines:e.lines, match:e.match, t0:e.time}; break;
      case 'CLEAR_HIGHLIGHT': st.hl = null; st.bhl = null; break;
      case 'SHOW_BLOCK': if (!st.blocks.has(e.block_id)) st.blocks.set(e.block_id, e.time); break;
      case 'HIGHLIGHT_BLOCK': if (!st.blocks.has(e.block_id)) st.blocks.set(e.block_id, e.time); st.bhl = {id:e.block_id, t0:e.time}; break;
      case 'SHOW_OUTPUT': st.output = {p, t0:e.time}; break;
      case 'MOVE_AGENT': {
        const a = st.agent; let dx = 0, dy = 0, dz = 0;
        const d = e.direction;
        if (d === 'up') dz = 1; else if (d === 'down') dz = -1;
        else { const off = {forward:0, right:1, back:2, left:3}[d]; const v = DIRV[(a.dir + off) % 4]; dx = v[0]; dy = v[1]; }
        const pe = ease(p);
        if (p >= 1){ a.x += dx * e.steps; a.y += dy * e.steps; a.z = Math.max(0, a.z + dz * e.steps); }
        else { a.x += dx * e.steps * pe; a.y += dy * e.steps * pe; a.z = Math.max(0, a.z + dz * e.steps * pe); }
        a.x = clamp(a.x, 0, 11); a.y = clamp(a.y, 0, 7);
        break;
      }
      case 'TURN_AGENT': {
        const a = st.agent; const s = e.direction === 'right' ? 1 : -1;
        if (p >= 1){ a.dir = (a.dir + s + 4) % 4; a.rot = a.dir * 90; } else a.rot = a.dir * 90 + s * 90 * ease(p);
        break;
      }
      case 'PLACE_BLOCK': {
        const a = st.agent; const gx = Math.round(a.x), gy = Math.round(a.y);
        let x = gx, y = gy, z = Math.round(a.z) - 1;
        if (e.direction === 'forward'){ x = gx + DIRV[a.dir][0]; y = gy + DIRV[a.dir][1]; z = Math.round(a.z); }
        st.placed = st.placed.filter(b => !(b.x === x && b.y === y && b.z === z));
        st.placed.push({x, y, z:Math.max(-1, z), block:e.block, p});
        break;
      }
      case 'DEMO': applyDemo(st, e, p); break;
      case 'SHOW_CHALLENGE': st.challenge = {text:e.text, t0:e.time}; break;
      case 'SHOW_QUIZ': st.quiz = {index:e.index, t0:e.time}; st.reveal = null; break;
      case 'REVEAL_ANSWER': st.quiz = st.quiz || {index:e.index, t0:e.time}; st.reveal = {index:e.index, t0:e.time}; break;
    }
  }
  return st;
}
function applyDemo(st, e, p){
  const s = st.sprite, r = st.rbx, pe = ease(p);
  switch (e.action){
    case 'move': { const d = parseFloat(e.value) || 10; const rad = (s.dir - 90) * Math.PI/180; s.x = clamp(s.x + Math.cos(rad) * d * pe, -220, 220); s.y = clamp(s.y - Math.sin(rad) * d * pe, -160, 160); break; }
    case 'turn': s.dir += (parseFloat(e.value) || 15) * pe; break;
    case 'say': s.say = e.value || ''; break;
    case 'go_to': { const [x, y] = String(e.value||'0,0').split(',').map(Number); s.x += ((x||0) - s.x) * pe; s.y += ((y||0) - s.y) * pe; break; }
    case 'collect': { if (!s.coin) break; s.x += (130 - s.x) * pe; s.y += (0 - s.y) * pe; if (p >= 1){ s.coin = false; const k = Object.keys(s.vars)[0] || 'score'; s.vars[k] = (parseFloat(s.vars[k]) || 0) + 1; } break; }
    case 'set_var': { const [k, v] = String(e.value||'score=0').split('='); s.vars[k.trim()] = (v ?? '0').trim(); break; }
    case 'change_var': { const m = String(e.value||'score+1').match(/^\s*([^+\-]+)\s*([+\-])\s*([\d.]+)/); if (m){ const k = m[1].trim(); s.vars[k] = (parseFloat(s.vars[k]) || 0) + (m[2] === '-' ? -1 : 1) * parseFloat(m[3]); } break; }
    case 'hide': s.visible = false; break;
    case 'show': s.visible = true; break;
    case 'touch': r.charX = r.charX + (1 - r.charX) * pe; break;
    case 'disappear': r.coin = 1 - p; break;
    case 'spawn': r.coin = p; break;
    case 'color': r.color = e.value || 'Bright red'; break;
    case 'jump': r.jump = Math.sin(p * Math.PI); break;
  }
}

/* ---------- canvas renderers ---------- */
const V = { // video palette
  bg:'#121A2B', bg2:'#18223A', panel:'#1B2540', line:'#2B3757', ink:'#EEF2FA', muted:'#93A0BC',
  marker:'#FFD54A', ok:'#5DD39E', bad:'#FF7A7A', accent:'#7B95FF',
  ed:'#0F1626', edGutter:'#5F6B86', kw:'#C9A2FF', str:'#9BE3A8', num:'#FFB86B', com:'#6F7C98', fn:'#8FB4FF', bi:'#56D6C9'
};
const FONT_UI = 'Figtree, system-ui, -apple-system, "Segoe UI", sans-serif';
const FONT_HEAD = '"Bricolage Grotesque", Figtree, system-ui, sans-serif';
const FONT_MONO = '"JetBrains Mono", ui-monospace, Menlo, Consolas, monospace';

function rr(ctx, x, y, w, h, r){ r = Math.min(r, w/2, h/2); ctx.beginPath(); ctx.moveTo(x+r, y); ctx.arcTo(x+w, y, x+w, y+h, r); ctx.arcTo(x+w, y+h, x, y+h, r); ctx.arcTo(x, y+h, x, y, r); ctx.arcTo(x, y, x+w, y, r); ctx.closePath(); }
function wrap(ctx, text, maxW){
  const out = []; for (const para of String(text||'').split('\n')){
    const ws = para.split(' '); let line = '';
    for (const w of ws){ const t = line ? line + ' ' + w : w; if (ctx.measureText(t).width > maxW && line){ out.push(line); line = w; } else line = t; }
    out.push(line);
  } return out;
}

const KW = {
  python:new Set('def return if elif else for while in import from as class try except finally with pass break continue and or not is None True False lambda global nonlocal yield'.split(' ')),
  luau:new Set('local function end if then else elseif for do while repeat until return and or not nil true false in break continue'.split(' ')),
  javascript:new Set('let const var function return if else for while do break continue new true false null undefined of in class'.split(' '))
};
const BUILTINS = {
  python:new Set('print range len input int str float list dict set tuple abs min max sum sorted enumerate zip round type'.split(' ')),
  luau:new Set('print game workspace script task Instance Vector3 CFrame BrickColor Color3 math string table wait pairs ipairs'.split(' ')),
  javascript:new Set('player agent blocks loops mobs console Math FORWARD BACK LEFT RIGHT UP DOWN LEFT_TURN RIGHT_TURN PLACE_ON_MOVE'.split(' '))
};
function tokenizeLine(line, lang){
  const com = lang === 'python' ? '#' : lang === 'luau' ? '--' : '//';
  const toks = []; let i = 0;
  const push = (t, c) => { if (t) toks.push({t, c}); };
  while (i < line.length){
    if (line.startsWith(com, i)){ push(line.slice(i), V.com); break; }
    const ch = line[i];
    if (ch === '"' || ch === "'" || (ch === '`' && lang === 'javascript')){
      let j = i + 1; while (j < line.length && line[j] !== ch){ if (line[j] === '\\') j++; j++; }
      push(line.slice(i, j+1), V.str); i = j + 1; continue;
    }
    if (/[0-9]/.test(ch)){ let j = i; while (j < line.length && /[0-9.]/.test(line[j])) j++; push(line.slice(i, j), V.num); i = j; continue; }
    if (/[A-Za-z_]/.test(ch)){
      let j = i; while (j < line.length && /[A-Za-z0-9_]/.test(line[j])) j++;
      const w = line.slice(i, j);
      let c = V.ink;
      if (KW[lang] && KW[lang].has(w)) c = V.kw;
      else if (BUILTINS[lang] && BUILTINS[lang].has(w)) c = V.bi;
      else if (line[j] === '(' || (line[j] === ':' && lang === 'luau' && /[A-Z]/.test(w[0]))) c = V.fn;
      push(w, c); i = j; continue;
    }
    let j = i; while (j < line.length && !/[A-Za-z0-9_"'`#]/.test(line[j]) && !line.startsWith(com, j)) j++;
    if (j === i) j = i + 1;
    push(line.slice(i, j), '#C7D0E3'); i = j;
  }
  return toks;
}

/* Reusable code editor (video). o: {lines, revealed, lang, hl, cursor, title, T} */
function drawCodeEditor(ctx, x, y, w, h, o){
  ctx.save();
  rr(ctx, x, y, w, h, 14); ctx.fillStyle = V.ed; ctx.fill();

  ctx.fillStyle = '#3E7CB1'; ctx.fillRect(cx - 18, cy - 62, 36, 40); // torso
  ctx.fillStyle = '#2F3A4A'; ctx.fillRect(cx - 18, cy - 22, 17, 22); ctx.fillRect(cx + 1, cy - 22, 17, 22); // legs
  ctx.fillStyle = '#E8C9A0'; ctx.fillRect(cx - 28, cy - 60, 10, 34); ctx.fillRect(cx + 18, cy - 60, 10, 34); // arms
  rr(ctx, cx - 14, cy - 92, 28, 28, 6); ctx.fill(); // head
  ctx.fillStyle = '#1B2230'; ctx.fillRect(cx - 7, cy - 82, 4, 5); ctx.fillRect(cx + 3, cy - 82, 4, 5);

}

function drawCaption(ctx, c, T){
  const b = beatAt(c, T); if (!b || !b.chunks.length) return;
  const frac = clamp((T - b.start) / Math.max(0.1, b.speak), 0, 0.999);
  const ch = b.chunks.find(k => frac >= k.from && frac < k.to) || b.chunks[b.chunks.length-1];
  ctx.save(); ctx.font = `600 28px ${FONT_UI}`;
  const lines = wrap(ctx, ch.text, 1000).slice(0, 2);
  const bw = Math.max(...lines.map(l => ctx.measureText(l).width)) + 48, bh = lines.length * 38 + 22;
  const bx = (W - bw) / 2, by = 690 - bh;
  rr(ctx, bx, by, bw, bh, 12); ctx.fillStyle = 'rgba(6,9,16,.82)'; ctx.fill();
  ctx.fillStyle = '#FFFFFF'; ctx.textAlign = 'center'; ctx.textBaseline = 'top';
  lines.forEach((l, i) => ctx.fillText(l, W/2, by + 12 + i * 38));

}

function layoutKind(scene, platform){
  const hasCode = !!scene.code.trim(), hasBlocks = scene.blocks.length > 0;
  if (platform === 'scratch' && hasBlocks) return 'scratch';
  if (platform === 'minecraft' && (hasBlocks || hasCode || scene.beats.some(b => b.events.some(e => /AGENT|PLACE_BLOCK/.test(e.type))))) return 'minecraft';
  if (platform === 'roblox' && (hasCode || scene.beats.some(b => b.events.some(e => e.type === 'DEMO')))) return 'roblox';
  if (hasCode) return 'code';
  if (platform === 'scratch' && scene.beats.some(b => b.events.some(e => e.type === 'DEMO'))) return 'scratch';
  return 'slide';
}

function drawTextSlide(ctx, st, T){
  let yy = 150;
  const heading = [...st.texts].reverse().find(t => t.style === 'heading');
  if (heading){
    ctx.font = `700 60px ${FONT_HEAD}`;
    const lines = wrap(ctx, heading.text, 1040).slice(0, 2);
    const p = clamp((T - heading.t0) / 0.5, 0, 1);
    lines.forEach((l, i) => {
      const lw = ctx.measureText(l).width;

      ctx.fillStyle = V.ink; ctx.textBaseline = 'alphabetic'; ctx.textAlign = 'left'; ctx.fillText(l, 120, yy + i*72 + 30);
    });
    yy += lines.length * 72 + 50;
  }
  const items = st.texts.filter(t => t.style !== 'heading').slice(-6);
  for (const t of items){
    const a = clamp((T - t.t0) / 0.35, 0, 1);
    ctx.globalAlpha = a; ctx.font = `500 34px ${FONT_UI}`;

    if (glyph){ ctx.fillStyle = t.style === 'mistake' ? V.bad : t.style === 'fix' ? V.ok : V.marker; ctx.font = `700 32px ${FONT_UI}`; ctx.fillText(glyph, 124, yy + 4); }
    else { ctx.fillStyle = V.marker; ctx.fillRect(126, yy - 14, 14, 14); }
    ctx.fillStyle = V.ink; ctx.font = `500 34px ${FONT_UI}`;
    lines.forEach((l, i) => ctx.fillText(l, 170, yy + i * 44));
    yy += lines.length * 44 + 22; ctx.globalAlpha = 1;
    if (yy > 560) break;
  }
}
function drawCallout(ctx, st, T){
  const t = st.texts[st.texts.length - 1]; if (!t) return;
  const a = clamp((T - t.t0) / 0.3, 0, 1);
  ctx.save(); ctx.globalAlpha = a; ctx.font = `600 22px ${FONT_UI}`;
  let txt = t.text; while (ctx.measureText(txt).width > 1150 && txt.length > 4) txt = txt.slice(0, -2);
  if (txt !== t.text) txt = txt.trim() + '…';
  const bw = ctx.measureText(txt).width + 44;
  rr(ctx, 40, 72, bw, 38, 19); ctx.fillStyle = t.style === 'mistake' ? '#4A2128' : t.style === 'fix' ? '#1E3F31' : '#2A3456'; ctx.fill();
  ctx.fillStyle = t.style === 'mistake' ? V.bad : t.style === 'fix' ? V.ok : V.marker; ctx.beginPath(); ctx.arc(58, 91, 5, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = V.ink; ctx.textBaseline = 'middle'; ctx.fillText(txt, 72, 92);
  ctx.restore();
}
function drawQuiz(ctx, lesson, st, T, full){
  const qq = lesson.quiz[st.quiz.index - 1]; if (!qq) return;
  const a = clamp((T - st.quiz.t0) / 0.35, 0, 1);

  ctx.font = `600 22px ${FONT_UI}`; ctx.fillStyle = V.marker; ctx.textBaseline = 'alphabetic'; ctx.textAlign = 'left';
  ctx.fillText(`Question ${st.quiz.index} of ${lesson.quiz.length}`, 120, 140);
  ctx.font = `700 42px ${FONT_HEAD}`; ctx.fillStyle = V.ink;
  const ql = wrap(ctx, qq.question, 1040).slice(0, 3); ql.forEach((l, i) => ctx.fillText(l, 120, 196 + i * 52));
  const top = 196 + ql.length * 52 + 20;

  qq.options.forEach((opt, i) => {

    ctx.fillStyle = reveal && correct ? V.ok : V.marker; ctx.font = `700 26px ${FONT_UI}`; ctx.textBaseline = 'middle';

    let t = opt; while (ctx.measureText(t).width > bw - 110 && t.length > 3) t = t.slice(0, -2); if (t !== opt) t += '…';
    ctx.fillText(t, bx + 64, by + bh/2);

function drawChallenge(ctx, lesson, st, T){

function renderFrame(ctx, lesson, tl, T, opts={}){
  const c = sceneAt(tl, T); if (!c) return;
  const sc = c.scene, P = PLATFORMS[lesson.platform];
  const st = sceneStateAt(c, T);

  ctx.fillStyle = V.bg; ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = 'rgba(255,255,255,.025)'; for (let gx = 0; gx < W; gx += 40) ctx.fillRect(gx, 0, 1, H);
  // header

  ctx.font = `600 16px ${FONT_UI}`; ctx.textBaseline = 'middle'; ctx.textAlign = 'left';
  const chip = P.label; const cw = ctx.measureText(chip).width + 34;
  rr(ctx, 24, 15, cw, 30, 15); ctx.fillStyle = 'rgba(255,255,255,.07)'; ctx.fill();
  ctx.fillStyle = P.color; ctx.beginPath(); ctx.arc(40, 30, 5, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = V.ink; ctx.fillText(chip, 52, 31);
  ctx.font = `700 22px ${FONT_HEAD}`; ctx.fillStyle = V.ink;
  let title = sc.title; while (ctx.measureText(title).width > 760 && title.length > 4) title = title.slice(0, -2);
  ctx.fillText(title, 24 + cw + 18, 31);
  ctx.font = `500 15px ${FONT_UI}`; ctx.fillStyle = V.muted; ctx.textAlign = 'right';
  ctx.fillText(`${lesson.lesson_title.slice(0, 40)}  ·  ${c.index + 1}/${tl.scenes.length}`, W - 24, 31);
  ctx.textAlign = 'left';
  // body
  const kind = layoutKind(sc, lesson.platform);
  const out = sceneOutput(lesson, sc);
  const editorOpts = (w) => ({lines:c.lines, revealed:st.revealed, lang:P.lang || 'python', hl:st.hl, cursor:st.cursor, title:P.file || 'code', T, fontSize: c.lines.length > 12 ? 22 : 26});
  if (kind === 'slide'){ if (!(st.quiz)) drawTextSlide(ctx, st, T); }
  else {
    drawCallout(ctx, st, T);
    if (kind === 'code'){ drawCodeEditor(ctx, 40, 122, 790, 468, editorOpts()); drawConsole(ctx, 850, 122, 390, 468, out, st); }
    else if (kind === 'roblox'){
      if (sc.code.trim()) drawCodeEditor(ctx, 40, 122, 700, 468, editorOpts()); else drawTextSlideMini(ctx, st, T, 40, 122, 700);
      drawRobloxViewport(ctx, 760, 122, 480, 300, st, T);
      drawConsole(ctx, 760, 432, 480, 158, out, st, 'Output');
    } else if (kind === 'scratch'){
      drawBlocksPanel(ctx, 40, 122, 690, 468, sc, BLOCK_SETS.scratch, st, T, 'Code — Scratch blocks');
      drawScratchStage(ctx, 750, 122, 490, 368, st, T);
      if (sc.expected_output && st.output){ ctx.font = `500 18px ${FONT_UI}`; ctx.fillStyle = V.muted; const l = wrap(ctx, sc.expected_output, 480).slice(0, 3); l.forEach((t, i) => ctx.fillText(t, 752, 512 + i * 24)); }
    } else if (kind === 'minecraft'){
      if (sc.blocks.length) drawBlocksPanel(ctx, 40, 122, 650, 468, sc, BLOCK_SETS.makecode, st, T, 'MakeCode — Blocks');
      else if (sc.code.trim()) drawCodeEditor(ctx, 40, 122, 650, 468, Object.assign(editorOpts(), {title:'MakeCode — JavaScript', fontSize:22}));
      else drawTextSlideMini(ctx, st, T, 40, 122, 650);
      drawMinecraftWorld(ctx, 710, 122, 530, 468, st, T);
    }
  }
  if (st.quiz) drawQuiz(ctx, lesson, st, T, kind === 'slide');
  if (st.challenge) drawChallenge(ctx, lesson, st, T);
  if (opts.captions !== false) drawCaption(ctx, c, T);
  // scene transition
  const into = T - c.start;
  if (into < 0.35){ ctx.fillStyle = `rgba(18,26,43,${1 - into / 0.35})`; ctx.fillRect(0, 60, W, H - 60); }
  ctx.restore();
}
function drawTextSlideMini(ctx, st, T, x, y, w){
  ctx.save(); rr(ctx, x, y, w, 468, 14); ctx.fillStyle = V.panel; ctx.fill();
  let yy = y + 60;
  for (const t of st.texts.slice(-6)){
    ctx.globalAlpha = clamp((T - t.t0) / 0.35, 0, 1);
    ctx.font = t.style === 'heading' ? `700 34px ${FONT_HEAD}` : `500 26px ${FONT_UI}`;
    ctx.fillStyle = t.style === 'heading' ? V.ink : '#D5DCEA';
    for (const l of wrap(ctx, t.text, w - 60).slice(0, 2)){ ctx.fillText(l, x + 30, yy); yy += t.style === 'heading' ? 44 : 34; }
    yy += 14;

/* ---------- AI narrator voice ----------
   Each beat's narration is synthesized once on the server (cached), decoded with Web Audio, and its real length
   becomes the beat's length in the timeline — so code, highlights and voice line up exactly, and the same audio
   is mixed into the exported video. */
const VoiceAI = {
  enabled:false, voice:'Achird', ctx:null, dest:null, buffers:new Map(), sources:new Set(), preparing:null,
  speed(){ return clamp(Player.wps / 2.6, 0.7, 1.4); },
  key(t){ return this.voice + '|' + this.speed().toFixed(2) + '|' + t; },
  duration(t){ if (!this.enabled || !t) return 0; const b = this.buffers.get(this.key(t)); return b ? b.duration : 0; },
  ensureCtx(){
    if (!this.ctx){ const AC = window.AudioContext || window.webkitAudioContext; this.ctx = new AC(); this.dest = this.ctx.createMediaStreamDestination(); }
    if (this.ctx.state === 'suspended') this.ctx.resume();
    return this.ctx;
  },
  missing(lesson){ const all = [...new Set(lesson.scenes.flatMap(s => s.beats.map(b => b.narration)).filter(Boolean))]; return {all, todo:all.filter(t => !this.buffers.has(this.key(t)))}; },
  async prepare(lesson, onProgress){
    this.ensureCtx();
    const {all, todo} = this.missing(lesson);
    let done = all.length - todo.length, i = 0, failed = null;
    onProgress && onProgress(done, all.length);
    const worker = async () => {
      while (i < todo.length && !failed){
        const t = todo[i++], k = this.key(t);
        try {
          const r = await api('POST', '/api/tts', {text:t, voice:this.voice, speed:this.speed()});
          const ab = await (await fetch(r.url, {credentials:'same-origin'})).arrayBuffer();
          this.buffers.set(k, await this.ctx.decodeAudioData(ab));
          onProgress && onProgress(++done, all.length);
        } catch (e) { failed = e; }
      }
    };
    await Promise.all([worker(), worker(), worker()]);
    if (failed) throw failed;
  },
  play(text, offset, toRecorder){
    const b = this.buffers.get(this.key(text)); if (!b || !this.ctx || offset >= b.duration) return;
    const s = this.ctx.createBufferSource(); s.buffer = b;
    s.connect(this.ctx.destination); if (toRecorder) s.connect(this.dest);
    s.start(0, Math.max(0, offset)); this.sources.add(s); s.onended = () => this.sources.delete(s);
  },
  stopAll(){ for (const s of this.sources){ try { s.stop(); } catch {} } this.sources.clear(); }
};

/* ---------- player & recorder ---------- */
const Player = {
  canvas:null, ctx:null, lesson:null, tl:null, t:0, playing:false, last:0, raf:0,
  voice:true, voiceMode:'browser', captions:true, wps:2.6, voiceName:'', speakingBeat:null, holdStart:0, recording:false, rangeEnd:null,
  attach(canvas, lesson){
    this.canvas = canvas; this.ctx = canvas.getContext('2d'); this.lesson = lesson;
    this.rebuild(); this.draw(); cancelAnimationFrame(this.raf); this.raf = requestAnimationFrame(n => this.loop(n));
  },
  rebuild(){ this.tl = compileLesson(this.lesson, this.wps); this.t = clamp(this.t, 0, this.tl.total); },
  detach(){ this.pause(); cancelAnimationFrame(this.raf); this.canvas = null; },
  play(){ if (VoiceAI.enabled) VoiceAI.ensureCtx(); if (this.t >= this.tl.total - 0.05) this.t = 0; this.playing = true; this.last = performance.now(); this.speakingBeat = null; const b = beatAt(sceneAt(this.tl, this.t), this.t); this.spokenKey = (!VoiceAI.enabled && b && this.t - b.start > 0.3) ? b : null; updateTransport(); },
  pause(){ this.playing = false; this.rangeEnd = null; if (window.speechSynthesis) speechSynthesis.cancel(); VoiceAI.stopAll(); this.speakingBeat = null; updateTransport(); },
  seek(t){ const was = this.playing; this.pause(); this.t = clamp(t, 0, this.tl.total); this.draw(); if (was) this.play(); updateTransport(); },
  speak(b){
    if (VoiceAI.enabled){ VoiceAI.play(b.narration, this.t - b.start, false); return; }
    if (!window.speechSynthesis || !b.narration) return;
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(b.narration);
    const v = speechSynthesis.getVoices().find(x => x.name === this.voiceName); if (v) u.voice = v;
    u.rate = clamp(this.wps / 2.6, 0.7, 1.4);
    this.speakingBeat = b;
    u.onend = u.onerror = () => { if (this.speakingBeat === b) this.speakingBeat = null; };
    speechSynthesis.speak(u);
  },
  loop(now){
    this.raf = requestAnimationFrame(n => this.loop(n));
    if (this.recording || !this.canvas) return;
    if (this.playing){
      let dt = Math.min(0.1, (now - this.last) / 1000); this.last = now;
      const c = sceneAt(this.tl, this.t), b = beatAt(c, this.t);
      if (this.voice && b && b !== this.spokenKey){ this.spokenKey = b; this.speak(b); this.holdStart = 0; }
      // voice-locked timing: wait at the end of a beat until the voice finishes the sentence (max 4 s)
      if (this.voice && b && this.speakingBeat === b && this.t + dt >= b.end - 0.02){
        if (!this.holdStart) this.holdStart = now;
        if (now - this.holdStart < 4000) dt = 0; else this.holdStart = 0;
      }
      this.t += dt;
      const end = this.rangeEnd ?? this.tl.total;
      if (this.t >= end){ this.t = end; this.pause(); }
      updateTransport();
    }
    this.draw();
  },
  draw(){ if (!this.canvas) return; renderFrame(this.ctx, this.lesson, this.tl, this.t, {captions:this.captions, scale:this.canvas.width / W}); }
};
function pickMime(withAudio){
  if (!window.MediaRecorder) return null;
  const list = withAudio
    ? ['video/mp4;codecs=avc1.42E01E,mp4a.40.2','video/mp4;codecs=avc1,mp4a.40.2','video/webm;codecs=vp9,opus','video/webm;codecs=vp8,opus','video/webm']
    : ['video/mp4;codecs=avc1.42E01E','video/mp4;codecs=avc1','video/mp4','video/webm;codecs=vp9','video/webm;codecs=vp8','video/webm'];
  for (const m of list) if (MediaRecorder.isTypeSupported(m)) return m;
  return null;
}
async function saveFile(filename, data){
  const blob = data instanceof Blob ? data : new Blob([data], {type:'application/octet-stream'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 60000);
  return true;
}
function safeName(s){ return String(s || 'lesson').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '').slice(0, 60) || 'lesson'; }

async function recordRange(t0, t1, label){
  const withAudio = VoiceAI.enabled;
  const mime = pickMime(withAudio);
  if (!mime || !Player.canvas.captureStream){ toast('This browser cannot record video. Use Chrome or Edge.'); return; }
  Player.pause();
  const ov = $('#rec-overlay'); ov.hidden = false;
  let cancelled = false; $('#rec-cancel').onclick = () => { cancelled = true; };
  try {
    if (withAudio){
      $('#rec-label').textContent = 'Preparing the narrator voice…';
      await VoiceAI.prepare(Player.lesson, (d, n) => { $('#rec-bar').style.width = (100 * d / Math.max(1, n)) + '%'; $('#rec-time').textContent = `${d} / ${n} sentences`; });
      Player.rebuild();
      const c0 = sceneAt(Player.tl, t0); if (label !== 'full lesson'){ t0 = c0.start; t1 = c0.end; } else t1 = Player.tl.total;
    }
    $('#rec-label').textContent = 'Running the code examples…';
    await prepareOutputs(Player.lesson);
  } catch (e) { ov.hidden = true; toast('Could not prepare the video: ' + (e.message || e.code)); return; }
  $('#rec-label').textContent = `Rendering ${label}…`;
  const vstream = Player.canvas.captureStream(30);
  const tracks = [...vstream.getVideoTracks()];
  if (withAudio){ VoiceAI.ensureCtx(); tracks.push(...VoiceAI.dest.stream.getAudioTracks()); }
  const stream = new MediaStream(tracks);
  const rec = new MediaRecorder(stream, {mimeType:mime, videoBitsPerSecond:6_000_000, audioBitsPerSecond:160_000});
  const chunks = []; rec.ondataavailable = e => { if (e.data && e.data.size) chunks.push(e.data); };
  const done = new Promise(r => rec.onstop = r);
  Player.recording = true;
  rec.start(500);
  const start = performance.now();
  let lastBeat = null;
  await new Promise(res => {
    const step = now => {
      const T = t0 + (now - start) / 1000;
      const Tc = Math.min(T, t1);
      if (withAudio){
        const b = beatAt(sceneAt(Player.tl, Tc), Tc);
        if (b && b !== lastBeat){ lastBeat = b; VoiceAI.play(b.narration, Tc - b.start, true); }
      }
      renderFrame(Player.ctx, Player.lesson, Player.tl, Tc, {captions:Player.captions, scale:Player.canvas.width / W});
      $('#rec-bar').style.width = (100 * clamp((T - t0) / (t1 - t0), 0, 1)) + '%';
      $('#rec-time').textContent = `${fmtTime(T - t0)} / ${fmtTime(t1 - t0)} — keep this tab visible while rendering`;
      if (T >= t1 + 0.4 || cancelled) return res();
      requestAnimationFrame(step);
    };
    requestAnimationFrame(step);
  });
  rec.stop(); await done; Player.recording = false; VoiceAI.stopAll();
  vstream.getTracks().forEach(t => t.stop());
  if (cancelled){ ov.hidden = true; toast('Rendering cancelled.'); return; }
  let blob = new Blob(chunks, {type:mime.split(';')[0]});
  let ext = mime.includes('mp4') ? 'mp4' : 'webm';
  if (ext === 'webm' && Server.config && Server.config.ffmpeg){
    $('#rec-label').textContent = 'Converting to MP4…'; $('#rec-time').textContent = 'This can take a minute for long lessons.'; $('#rec-bar').style.width = '100%';
    try {
      const res = await fetch('/api/convert', {method:'POST', credentials:'same-origin', headers:{'content-type':'video/webm'}, body:blob});
      if (!res.ok){ let m = ''; try { m = (await res.json()).message; } catch {} throw new Error(m || 'conversion failed'); }
      blob = await res.blob(); ext = 'mp4';
    } catch (e) { toast('MP4 conversion failed, saving WebM instead: ' + e.message); }
  }
  ov.hidden = true;
  await saveFile(`${safeName(Player.lesson.lesson_title)}${label === 'full lesson' ? '' : '-' + safeName(label)}.${ext}`, blob);
  toast(`Saved ${ext.toUpperCase()} (${(blob.size / 1048576).toFixed(1)} MB)`);
}
function buildVTT(tl){
  const ts = s => { const h = Math.floor(s/3600), m = Math.floor(s%3600/60), sec = (s%60).toFixed(3).padStart(6,'0'); return `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${sec}`; };
  let out = 'WEBVTT\n\n', n = 1;
  for (const c of tl.scenes) for (const b of c.beats) for (const k of b.chunks){
    const a = b.start + k.from * b.speak, e = b.start + k.to * b.speak;
    out += `${n++}\n${ts(a)} --> ${ts(e)}\n${k.text}\n\n`;
  }
  return out;
}
