name: Test and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: Test (build + run the full stack)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Syntax check
        run: for f in server/*.js scripts/*.js; do node --check "$f"; done

      - name: Sandbox limit tests
        run: python3 scripts/test-sandbox.py

      - name: Build and start the app + sandbox containers
        run: |
          cp .env.example .env
          sed -i "s|^SESSION_SECRET=.*|SESSION_SECRET=$(openssl rand -hex 32)|" .env
          docker compose up -d --build
          for i in $(seq 1 30); do curl -fsS http://localhost:3000/api/config >/dev/null && break; sleep 2; done

      - name: Smoke test (sign-up, lessons, Python sandbox, network isolation)
        run: node scripts/smoke.js http://localhost:3000

      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color

  deploy:
    name: Deploy to server
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      HAS_SERVER: ${{ secrets.VPS_HOST != '' && secrets.VPS_SSH_KEY != '' }}
    steps:
      - name: Skip (no server configured)
        if: env.HAS_SERVER != 'true'
        run: echo "::notice::No VPS_HOST / VPS_SSH_KEY secrets set — skipping deploy. See README › Auto-deploy from GitHub."

      - name: Deploy over SSH
        if: env.HAS_SERVER == 'true'
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER || 'deploy' }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          command_timeout: 15m
          script: |
            set -e
            cd "${{ secrets.VPS_APP_DIR || '$HOME/codelesson-ai' }}"
            git fetch --quiet origin main
            git reset --hard origin/main
            docker compose up -d --build --remove-orphans
            docker image prune -f >/dev/null
            for i in $(seq 1 30); do curl -fsS http://localhost:3000/api/config >/dev/null && echo "✓ deployed $(git rev-parse --short HEAD)" && exit 0; sleep 2; done
            echo "App did not come up after deploy"; docker compose logs --tail 80 app; exit 1
